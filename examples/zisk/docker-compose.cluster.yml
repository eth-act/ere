services:
  # Fills the proving key volume once, with the same archive and `.md5` marker
  # as crates/prover/zisk/src/sdk/proving_key.rs.
  zisk-proving-key:
    image: ghcr.io/eth-act/ere/ere-server-zisk:latest-cuda
    entrypoint: bash
    working_dir: /root/.zisk/provingKey
    command:
      - -ec
      - |
        MD5=879b7f726cf48e8a53be877020068548
        grep -qx $$MD5 .md5 2>/dev/null && exit 0
        curl -fsSL -o key.tar.gz https://storage.googleapis.com/zisk-setup/zisk-provingkey-1.3.0-alpha-blake3.tar.gz
        echo "$$MD5  key.tar.gz" | md5sum -c
        tar xzf key.tar.gz -C /root/.zisk
        rm key.tar.gz
        echo $$MD5 > .md5
    volumes:
      - zisk-proving-key-v1.3.0-alpha:/root/.zisk/provingKey

  zisk-coordinator:
    image: ghcr.io/eth-act/ere/ere-server-zisk:latest-cuda
    entrypoint: zisk-coordinator
    ports:
      - "7000:7000"
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  zisk-worker-0:
    image: ghcr.io/eth-act/ere/ere-server-zisk:latest-cuda
    entrypoint: zisk-worker
    command:
      - "--coordinator-url"
      - "http://zisk-coordinator:50051"
      - "--gpu"
    environment:
      - RUST_LOG=info
    volumes:
      - zisk-proving-key-v1.3.0-alpha:/root/.zisk/provingKey
    restart: unless-stopped
    depends_on:
      zisk-coordinator:
        condition: service_healthy
      zisk-proving-key:
        condition: service_completed_successfully
    shm_size: 32G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "pgrep", "-f", "zisk-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # Uncomment to add more workers if more GPUs are available.
  # zisk-worker-x:
  #   extends: zisk-worker-0
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ['x']
  #             capabilities: [gpu]

volumes:
  zisk-proving-key-v1.3.0-alpha:

networks:
  default:
