[package]
name = "ere-prover-pico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# Pico dependencies
pico-prover.workspace = true
libc = { workspace = true, optional = true }

# Local dependencies
ere-compiler-core.workspace = true
ere-prover-core.workspace = true
ere-verifier-pico.workspace = true

[dev-dependencies]
ere-compiler-pico.workspace = true
ere-util-test = { workspace = true, features = ["host"] }

[features]
default = []
# Builds each guest's pure-mode AOT library in the background from setup on (needs cargo at run
# time) and executes on it; without it, or when the build fails, execution runs on Pico's
# interpreter. `ere-server`'s `pico` feature turns it on.
pure-aot = ["pico-prover/pure-build", "dep:libc"]
cuda = ["pico-prover/cuda", "pico-prover/bigint-rug", "pico-prover/tcmalloc"]

[lints]
workspace = true
