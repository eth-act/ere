[workspace]
members = [
    # Compiler
    "crates/compiler/cli",
    "crates/compiler/core",
    "crates/compiler/openvm",
    "crates/compiler/sp1",
    "crates/compiler/zisk",
    # Platform
    "crates/platform/core",
    "crates/platform/openvm",
    "crates/platform/sp1",
    "crates/platform/zisk",
    # Prover
    "crates/prover/core",
    "crates/prover/openvm",
    "crates/prover/sp1",
    "crates/prover/zisk",
    # Verifier
    "crates/verifier/verifier",
    "crates/verifier/core",
    "crates/verifier/openvm",
    "crates/verifier/sp1",
    "crates/verifier/zisk",
    # Server
    "crates/server/api",
    "crates/server/cli",
    "crates/server/client",
    # Cluster client
    "crates/cluster-client/zisk",
    # Dockerized wrapper
    "crates/dockerized",
    # Verifier bindings
    "bindings/c",
    # Util
    "crates/catalog",
    "crates/codec",
    "crates/util/build",
    "crates/util/compile",
    "crates/util/test",
    "crates/util/tokio",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.lints]

[workspace.dependencies]
anyhow = "1.0.98"
auto_impl = "1.3.0"
bincode = { version = "2.0.1", default-features = false }
bitcode = { version = "0.6", default-features = false }
blake3 = "1.8"
bytemuck = "1.25.0"
cargo_metadata = "0.19.0"
cbindgen = "0.29"
ciborium = { version = "0.2.2", default-features = false }
ciborium-io = { version = "0.2.2", default-features = false }
clap = "4.5.42"
criterion = "0.8"
crossbeam-channel = "0.5.15"
digest = { version = "0.10.7", default-features = false }
eyre = "0.6.12"
fnv = { version = "1.0.7", default-features = false }
futures-util = "0.3"
http = "1"
indexmap = "2.10.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mpi = "0.8.0"
once_cell = "1.21"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry_sdk = "0.31"
parking_lot = "0.12.5"
paste = "1.0.15"
postcard = { version = "1.0.8", default-features = false }
prost = "0.14"
pin-project-lite = "0.2.17"
prost-build = "0.14"
prost-types = "0.14"
rand = "0.9.2"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde-big-array = "0.5.1"
serde_bytes = { version = "0.11.19", default-features = false }
serde_json = "1.0.142"
serde_yaml = "0.9.34"
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
strum = "0.27.2"
tempfile = "3.20.0"
thiserror = { version = "2.0.12", default-features = false }
tokio = "1.0"
toml = "0.8.23"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5.3"
tower-http = "0.6.6"
tracing = "0.1.41"
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3.19"
twirp = "0.10"
twirp-build = "0.10"
uuid = "1"

# OpenVM dependencies
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0", default-features = false }
openvm-build = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0" }
openvm-circuit = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0", default-features = false }
openvm-continuations = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0", default-features = false }
openvm-sdk = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0" }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0", default-features = false }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0", default-features = false }
openvm-verify-stark-host = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.0.0", default-features = false }
openvm-stark-sdk = { git = "https://github.com/han0110/stark-backend.git", branch = "patch/v2.0.0", default-features = false, features = ["parallel"] }

# SP1 dependencies
sp1-core-executor = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-cuda = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-hypercube = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-primitives = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-recursion-executor = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-verifier = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1" }
sp1-zkvm = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1", default-features = false }
sp1-libzkevm = { git = "https://github.com/succinctlabs/sp1", tag = "v6.3.1", package = "libzkevm" }

# ZisK dependencies
proofman-fields = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v1.0.0-alpha", package = "fields" }
proofman-starks-lib-c = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v1.0.0-alpha" }
proofman-util = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v1.0.0-alpha" }
proofman-verifier = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v1.0.0-alpha" }
zisk-common = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha" }
zisk-core = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha" }
zisk-prover-backend = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha" }
zisk-rom-setup = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha", package = "rom-setup" }
zisk-sm-rom = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha", package = "sm-rom" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha" }
zisk-verifier = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha" }
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.0.0-alpha", default-features = false }

# Local dependencies
ere-compiler = { path = "crates/compiler/cli" }
ere-compiler-core = { path = "crates/compiler/core" }
ere-compiler-openvm = { path = "crates/compiler/openvm" }
ere-compiler-sp1 = { path = "crates/compiler/sp1" }
ere-compiler-zisk = { path = "crates/compiler/zisk" }
ere-platform-core = { path = "crates/platform/core" }
ere-platform-openvm = { path = "crates/platform/openvm" }
ere-platform-sp1 = { path = "crates/platform/sp1" }
ere-platform-zisk = { path = "crates/platform/zisk" }
ere-prover-core = { path = "crates/prover/core" }
ere-prover-openvm = { path = "crates/prover/openvm" }
ere-prover-sp1 = { path = "crates/prover/sp1" }
ere-prover-zisk = { path = "crates/prover/zisk" }
ere-verifier = { path = "crates/verifier/verifier" }
ere-verifier-core = { path = "crates/verifier/core" }
ere-verifier-openvm = { path = "crates/verifier/openvm" }
ere-verifier-sp1 = { path = "crates/verifier/sp1" }
ere-verifier-zisk = { path = "crates/verifier/zisk" }
ere-server = { path = "crates/server/cli" }
ere-server-api = { path = "crates/server/api" }
ere-server-client = { path = "crates/server/client" }
ere-cluster-client-zisk = { path = "crates/cluster-client/zisk" }
ere-dockerized = { path = "crates/dockerized" }
ere-catalog = { path = "crates/catalog" }
ere-codec = { path = "crates/codec" }
ere-util-build = { path = "crates/util/build" }
ere-util-compile = { path = "crates/util/compile" }
ere-util-test = { path = "crates/util/test" }
ere-util-tokio = { path = "crates/util/tokio" }
